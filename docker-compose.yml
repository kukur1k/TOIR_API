services:
  db:
    image: postgres:16
    container_name: toir-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
      # POSTGRES_DB не указываем → создастся дефолтная "postgres"
    ports:
      - "5333:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: toir-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      EnableSwagger: "true"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=postgres;Username=postgres;Password=123"
    ports:
      - "8080:8080"

volumes:
  pgdata: